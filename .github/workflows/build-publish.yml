name: Mobidrom X2GBFS CI

on:
  push:
    branches:
      - "main"
  pull_request:
    types: [opened, reopened, synchronize]
permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  application-ci-cd:
    name: Build, Package, Write-Back and Push Updates
    uses: mobidrom/github-actions/.github/workflows/ci.yaml@main
    secrets: inherit
    with:
      source-repository: "x2gbfs"
      tech-stack: "container"
      image-app-name: "x2gbfs-extractor"
      image-app-dir: "."
      image-files: |
        config/**
        config_mobidrom/**
        tests/**
        x2gbfs/**
        Dockerfile
        Makefile
        pyproject.toml
        requirements.txt
        run_all.sh
      image-parent-directories: "."
      chart-app-name: "dynamic-details"
      chart-files: charts/**
      write-back-image-fields: |
        {  "name": ".mobidp-base-importer-chart.importerStep.image.tag", "path": "charts/PATH/values.yaml" },
        {  "name": ".appVersion", "path": "charts/PATH/Chart.yaml" }
      write-back-chart-fields: |
        { "name": ".version", "path": "PATH/Chart.yaml" }
      config-type: "workflows-helm"
